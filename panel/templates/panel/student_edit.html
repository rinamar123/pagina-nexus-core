<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nexus Core | Editar Estudiante</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2103/2103633.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --dark-bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--dark-bg); color: white; min-height: 100vh; display: flex; }
        
        .sidebar { width: 280px; background: rgba(255,255,255,0.01); border-right: 1px solid rgba(255,255,255,0.05); padding: 3rem 1.5rem; position: sticky; top: 0; height: 100vh; }
        .main { flex: 1; padding: 3rem; background-image: radial-gradient(circle at 0% 0%, rgba(188, 19, 254, 0.05) 0%, transparent 50%); overflow-y: auto; }
        
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.3rem; margin-bottom: 2rem; background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .form-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 2rem; padding: 3rem; backdrop-filter: blur(20px); max-width: 800px; box-shadow: 0 0 50px rgba(0, 242, 255, 0.05); }
        .form-card h2 { font-family: 'Space Grotesk', sans-serif; color: var(--neon-blue); margin-bottom: 2rem; font-size: 1.3rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group.full-width { grid-column: 1 / -1; }
        
        label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--neon-blue); letter-spacing: 1px; }
        
        input, select { 
            width: 100%; 
            padding: 1rem; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid var(--glass-border); 
            border-radius: 1rem; 
            color: white; 
            outline: none; 
            transition: all 0.3s; 
            font-size: 0.9rem;
        }
        input:focus, select:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
        select option { background: #111; color: white; }
        
        /* Checkboxes for courses */
        .courses-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 1rem; 
            background: rgba(0,0,0,0.2); 
            padding: 1.5rem; 
            border-radius: 1rem; 
            border: 1px solid var(--glass-border); 
        }
        
        .checkbox-container { 
            display: flex; 
            align-items: center; 
            gap: 0.8rem; 
            background: rgba(255,255,255,0.01); 
            border: 1px solid var(--glass-border); 
            padding: 0.8rem 1rem; 
            border-radius: 0.8rem; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .checkbox-container:hover { border-color: var(--neon-purple); background: rgba(188, 19, 254, 0.02); }
        
        .checkbox-container input[type="checkbox"] { 
            width: auto; 
            cursor: pointer; 
            accent-color: var(--neon-purple);
            transform: scale(1.2);
        }
        .checkbox-label { font-size: 0.8rem; color: rgba(255,255,255,0.8); font-weight: 600; }
        
        /* Action Buttons */
        .btn-group { display: flex; gap: 1.5rem; margin-top: 2rem; border-top: 1px solid var(--glass-border); padding-top: 2rem; }
        .btn-submit { 
            padding: 1rem 2.5rem; 
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); 
            border: none; 
            color: white; 
            font-weight: 700; 
            text-transform: uppercase; 
            font-size: 0.8rem; 
            letter-spacing: 1px; 
            border-radius: 1rem; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .btn-submit:hover { transform: scale(1.03); box-shadow: 0 0 20px rgba(188, 19, 254, 0.4); }
        
        .btn-cancel { 
            padding: 1rem 2.5rem; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid var(--glass-border); 
            color: rgba(255,255,255,0.6); 
            font-weight: 700; 
            text-transform: uppercase; 
            font-size: 0.8rem; 
            letter-spacing: 1px; 
            border-radius: 1rem; 
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s; 
        }
        .btn-cancel:hover { background: rgba(255,255,255,0.1); color: white; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color: var(--neon-blue); margin-bottom: 3rem;">NEXUS CORE</h2>
        <nav style="display: flex; flex-direction: column; gap: 1rem; height: calc(100% - 100px);">
            <a href="{% url 'admin_dashboard' %}" style="color: white; text-decoration: none; font-weight: 600; padding: 1rem; border-radius: 1rem; transition: 0.3s;">Dashboard</a>
            <a href="{% url 'admin_grade_assignments' %}" style="color: white; text-decoration: none; font-weight: 600; padding: 1rem; border-radius: 1rem; transition: 0.3s;">📝 Calificar Entregas</a>
            <a href="{% url 'admin_logout' %}" style="margin-top: auto; color: #ff4d4d; text-decoration: none; font-weight: 700; font-size: 0.8rem; padding: 1rem;">DESCONECTAR</a>
        </nav>
    </div>

    <div class="main">
        <h1>Gestión de Unidades de Aprendizaje</h1>
        
        <div class="form-card">
            <h2>Modificar Registro: {{ student.name }}</h2>
            
            <form method="POST">
                {% csrf_token %}
                <div class="form-grid">
                    <!-- Nombre -->
                    <div class="form-group">
                        <label for="name">Nombre Completo</label>
                        <input type="text" id="name" name="name" value="{{ student.name }}" required>
                    </div>
                    
                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Dirección de Email</label>
                        <input type="email" id="email" name="email" value="{{ student.email }}" required>
                    </div>
                    
                    <!-- Teléfono -->
                    <div class="form-group">
                        <label for="phone">Teléfono de Enlace</label>
                        <input type="text" id="phone" name="phone" value="{{ student.phone|default:'' }}">
                    </div>
                    
                    <!-- Dirección -->
                    <div class="form-group">
                        <label for="address">Dirección Física</label>
                        <input type="text" id="address" name="address" value="{{ student.address|default:'' }}">
                    </div>
                    
                    <!-- Nivel -->
                    <div class="form-group">
                        <label for="level">Nivel Cognitivo</label>
                        <select id="level" name="level">
                            <option value="principiante" {% if student.level == 'principiante' %}selected{% endif %}>Principiante</option>
                            <option value="intermedio" {% if student.level == 'intermedio' %}selected{% endif %}>Intermedio</option>
                            <option value="avanzado" {% if student.level == 'avanzado' %}selected{% endif %}>Avanzado</option>
                        </select>
                    </div>
                    
                    <!-- Estado -->
                    <div class="form-group">
                        <label for="status">Estado del Sistema</label>
                        <select id="status" name="status">
                            <option value="pending" {% if student.status == 'pending' %}selected{% endif %}>Pendiente</option>
                            <option value="accepted" {% if student.status == 'accepted' %}selected{% endif %}>Aceptado</option>
                            <option value="rejected" {% if student.status == 'rejected' %}selected{% endif %}>Rechazado</option>
                            <option value="suspended" {% if student.status == 'suspended' %}selected{% endif %}>Suspendido</option>
                        </select>
                    </div>
                    
                    <!-- Cursos Sincronizados -->
                    <div class="form-group full-width" style="margin-top: 1rem;">
                        <label style="margin-bottom: 0.8rem; display: block;">Matricular en Cursos Activos</label>
                        <div class="courses-grid">
                            {% for c in courses %}
                            <label class="checkbox-container">
                                <input type="checkbox" name="courses" value="{{ c.id }}" {% if c in student.courses.all %}checked{% endif %}>
                                <span class="checkbox-label">{{ c.title }}</span>
                            </label>
                            {% empty %}
                            <p style="color: rgba(255,255,255,0.3); font-size: 0.8rem;">No hay cursos creados en el sistema.</p>
                            {% endfor %}
                        </div>
                    </div>
                </div>
                
                <div class="btn-group">
                    <button type="submit" class="btn-submit">Guardar Cambios</button>
                    <a href="{% url 'admin_dashboard' %}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>

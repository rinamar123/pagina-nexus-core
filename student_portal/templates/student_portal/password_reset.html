<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperación de Acceso - IA Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --dark-bg: #050505;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--dark-bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            color: white;
            background-image: radial-gradient(circle at center, rgba(188, 19, 254, 0.05) 0%, transparent 70%);
        }
        .login-card { 
            background: rgba(255,255,255,0.03); 
            padding: 3rem; 
            border-radius: 2rem; 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 0 50px rgba(188, 19, 254, 0.1);
        }
        h1 { 
            text-align: center; 
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem; 
            font-size: 1.5rem;
        }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--neon-purple); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        input { 
            width: 100%; 
            padding: 1rem; 
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1rem; 
            color: white;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
        .btn { 
            width: 100%; 
            padding: 1rem; 
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            color: white; 
            border: none; 
            border-radius: 1rem; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-sizing: border-box;
        }
        .back { display: block; text-align: center; margin-top: 1.5rem; color: rgba(255,255,255,0.3); text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="font-size: 3rem; text-align: center; margin-bottom: 1rem;">🔑</div>
        <h1>RESTAURAR CREDENCIALES</h1>
        <p style="text-align: center; font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-bottom: 2rem;">Ingresa el correo electrónico asociado a tu cuenta y te enviaremos un enlace seguro para restablecer tu contraseña.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" name="email" required>
            </div>
            <button type="submit" class="btn">Solicitar Enlace</button>
        </form>
        <a href="{% url 'student_login' %}" class="back">← Cancelar y volver al Login</a>
    </div>
</body>
</html>

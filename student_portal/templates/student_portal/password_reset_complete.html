<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualización Exitosa - IA Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --dark-bg: #050505;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--dark-bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            color: white;
            background-image: radial-gradient(circle at center, rgba(0, 242, 255, 0.05) 0%, transparent 70%);
        }
        .login-card { 
            background: rgba(255,255,255,0.03); 
            padding: 3rem; 
            border-radius: 2rem; 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.1);
            text-align: center;
        }
        h1 { 
            font-family: 'Space Grotesk', sans-serif;
            color: var(--neon-blue);
            margin-bottom: 1rem; 
            font-size: 1.5rem;
        }
        .btn { 
            display: block;
            width: 100%; 
            padding: 1rem; 
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            color: white; 
            border: none; 
            border-radius: 1rem; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-sizing: border-box;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="font-size: 4rem; margin-bottom: 1rem; color: var(--neon-blue);">✅</div>
        <h1>PROTOCOLO EXITOSO</h1>
        <p style="font-size: 0.9rem; color: rgba(255,255,255,0.8); line-height: 1.6;">
            Tu contraseña ha sido actualizada correctamente en los servidores de la Academia.
        </p>
        <a href="{% url 'student_login' %}" class="btn">INICIAR SESIÓN AHORA</a>
    </div>
</body>
</html>

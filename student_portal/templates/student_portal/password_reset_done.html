<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Enlace Enviado - IA Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --dark-bg: #050505;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--dark-bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            color: white;
            background-image: radial-gradient(circle at center, rgba(0, 255, 128, 0.05) 0%, transparent 70%);
        }
        .login-card { 
            background: rgba(255,255,255,0.03); 
            padding: 3rem; 
            border-radius: 2rem; 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 0 50px rgba(0, 255, 128, 0.1);
            text-align: center;
        }
        h1 { 
            font-family: 'Space Grotesk', sans-serif;
            color: #00ff80;
            margin-bottom: 1rem; 
            font-size: 1.5rem;
        }
        .back { display: block; margin-top: 2rem; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.2); padding: 1rem; border-radius: 1rem; transition: 0.3s;}
        .back:hover { background: rgba(255,255,255,0.05); color: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="font-size: 4rem; margin-bottom: 1rem; color: #00ff80;">✉️</div>
        <h1>ENLACE ENVIADO</h1>
        <p style="font-size: 0.9rem; color: rgba(255,255,255,0.8); line-height: 1.6;">
            Hemos despachado un enlace seguro a tu correo electrónico. Sigue las instrucciones para restablecer tus credenciales de acceso.
        </p>
        <p style="font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 1rem;">
            Si no lo encuentras en tu bandeja principal, revisa la carpeta de Spam.
        </p>
        <a href="{% url 'student_login' %}" class="back">Volver a la pantalla de Acceso</a>
    </div>
</body>
</html>

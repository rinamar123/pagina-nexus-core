<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Perfil | IA Academy</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Outfit:wght@400;800&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --dark-bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            background-image: radial-gradient(circle at center, rgba(0, 242, 255, 0.05) 0%, transparent 70%);
            padding: 2rem;
            box-sizing: border-box;
        }

        .profile-edit-container {
            max-width: 600px;
            width: 100%;
            padding: 3rem;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.05);
            box-sizing: border-box;
        }

        .profile-edit-container h2 {
            font-family: 'Outfit', sans-serif;
            color: var(--neon-blue);
            margin-bottom: 2rem;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--neon-purple);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .cyber-input {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 1rem;
            font-family: 'Space Grotesk', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .cyber-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        .file-upload-container {
            border: 1px dashed rgba(255, 255, 255, 0.3);
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
            transition: 0.3s;
        }

        .file-upload-container:hover {
            border-color: var(--neon-purple);
            background: rgba(188, 19, 254, 0.05);
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            border: none;
            color: white;
            border-radius: 1rem;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 255, 0.4);
        }
    </style>
</head>

<body>
    <div class="profile-edit-container">
        <h2><span>⚙️</span> ACTUALIZAR PERFIL</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label>Avatar de Red (Opcional)</label>
                <div class="file-upload-container">
                    <div style="margin-bottom: 1rem; font-size: 2rem;">📸</div>
                    <input type="file" name="profile_picture" accept="image/*" style="color: white; font-size: 0.9rem;">
                    <div style="font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 0.5rem;">JPG, PNG, GIF.
                        Máx 5MB.</div>
                </div>
            </div>

            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" name="name" class="cyber-input" value="{{ student.name }}" required>
            </div>

            <div class="form-group">
                <label>Correo Electrónico (No modificable)</label>
                <input type="email" class="cyber-input" value="{{ student.email }}" disabled
                    style="opacity: 0.5; cursor: not-allowed;">
            </div>

            <div class="form-group">
                <label>Teléfono de Contacto</label>
                <input type="text" name="phone" class="cyber-input" value="{{ student.phone|default:'' }}"
                    placeholder="+57 300 000 0000">
            </div>

            <div class="form-group">
                <label>Ubicación / Base de Operaciones</label>
                <input type="text" name="address" class="cyber-input" value="{{ student.address|default:'' }}"
                    placeholder="Ciudad, País">
            </div>

            <button type="submit" class="btn-submit">Sincronizar Datos</button>
        </form>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="{% url 'student_dashboard' %}"
                style="color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem;">← Volver al
                Dashboard</a>
        </div>
    </div>
</body>

</html>

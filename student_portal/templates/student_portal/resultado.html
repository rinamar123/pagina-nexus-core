<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del Examen</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Outfit:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --dark-bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
        }
        body {
            background: var(--dark-bg);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 2rem;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .card h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 1.5rem;
        }
        .score {
            font-size: 4rem;
            font-weight: 700;
            margin: 1rem 0;
        }
        .score.passed { color: #00ff80; text-shadow: 0 0 30px rgba(0,255,128,0.3); }
        .score.failed { color: #ff3333; text-shadow: 0 0 30px rgba(255,51,51,0.3); }
        .detail {
            font-size: 1rem;
            color: rgba(255,255,255,0.6);
            margin: 0.5rem 0;
        }
        .badge {
            display: inline-block;
            padding: 0.4rem 1.5rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 1rem;
        }
        .badge.passed { background: rgba(0,255,128,0.15); color: #00ff80; border: 1px solid #00ff80; }
        .badge.failed { background: rgba(255,51,51,0.15); color: #ff3333; border: 1px solid #ff3333; }
        .back-link {
            display: inline-block;
            margin-top: 2rem;
            color: var(--neon-blue);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .back-link:hover { text-shadow: 0 0 10px var(--neon-blue); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Resultado</h1>
        <div class="score {% if attempt.passed %}passed{% else %}failed{% endif %}">
            {{ attempt.score }}/{{ attempt.total }}
        </div>
        <div class="detail">Porcentaje: {% widthratio attempt.score attempt.total 100 %}%</div>
        <div class="badge {% if attempt.passed %}passed{% else %}failed{% endif %}">
            {% if attempt.passed %}APROBADO{% else %}REPROBADO{% endif %}
        </div>
        <br>
        <a class="back-link" href="{% url 'student_dashboard' %}">&larr; Volver al Dashboard</a>
    </div>
</body>
</html>
